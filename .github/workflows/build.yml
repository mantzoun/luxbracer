name: CI Pipeline

on:
  push:
    branches:
      - '*'

permissions:
  checks: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential gcc g++ make git wget file jq curl cpplint cppcheck libopus-dev lcov
          export DPP_VER=10.1.2
          export DPP_URL=https://github.com/brainboxdotcc/DPP/releases/download/v${DPP_VER}/libdpp-${DPP_VER}-linux-x64.deb
          cd /tmp
          wget -O dpp.deb ${DPP_URL}
          sudo apt install -y ./dpp.deb

      - name: Build
        run: make -j4 all

      - name: Static Code Analysis
        run: make cppcheck
        continue-on-error: true

      - name: Linting
        run: make cpplint
        continue-on-error: true

      - name: Unit testing
        run: make -j4 test_ci
        continue-on-error: true

      - name: Code coverage
        run: make coverage
        continue-on-error: true

      - name: Selialization check
        run: make serialization_check
        continue-on-error: true

      - name: Publish test results
        uses: dorny/test-reporter@v1
        with:
          name: Unit Tests
          path: results.xml
          reporter: java-junit

      - name: Upload coverage results
        uses: actions/upload-artifact@v4
        with:
          name: coverage-results
          path: |
            ./coverage_clean.info
            out/

