name: CI Pipeline

on:
  push:
    branches:
      - '*'

jobs:
  build:
    runs-on: armada

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build
        run: make all

  lint:
    runs-on: armada
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Run clang-tidy
        run: |
          make tidy

  sca:
    runs-on: armada
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Static Code Analysis
        run: |
          cppcheck src/ --enable=all --inconclusive --error-exitcode=1

  valgrind:
    runs-on: armada
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Run valgrind
        run: |
          valgrind ./bin/myapp

  test:
    runs-on: armada
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Run unit tests
        run: make test
