name: CI Pipeline

on:
  push:
    branches:
      - '*'

jobs:
  build:
    runs-on: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build
        run: make -j4 all

  lint:
    runs-on: lint
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Run cpplint
        run: |
          make cpplint

  sca:
    runs-on: sca
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Static Code Analysis
        run: |
          make cppcheck

  test-and-coverage:
    runs-on: test
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Run unit tests
        run: |
          make test

      - name: Collect coverage
        run: |
          make coverage

      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: unittest-results
          path: results.xml

      - name: Upload coverage results
        uses: actions/upload-artifact@v4
        with:
          name: coverage-results
          path: |
            ./coverage_clean.info
            out/
